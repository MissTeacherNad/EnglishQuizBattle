<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>English Quiz Battle – Connexion professeur</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="panel" style="max-width:560px;margin:40px auto;padding:24px"><h1>English Quiz Battle</h1><h2>Connexion professeur</h2><p>Page temporaire de configuration. Cette connexion ne donne pas encore de droits professeur.</p><button id="login" class="btn primary" disabled>Se connecter avec Google</button><button id="logout" class="btn soft" hidden>Se déconnecter</button><p id="status" role="status">Initialisation…</p></section></main><script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script>
(async()=>{const login=document.getElementById('login'),logout=document.getElementById('logout'),status=document.getElementById('status');try{const app=firebase.initializeApp(window.QB_FIREBASE_CONFIG,'teacherSetup');const auth=app.auth();await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);auth.onAuthStateChanged(u=>{const ok=!!u&&!u.isAnonymous;login.hidden=ok;login.disabled=false;logout.hidden=!ok;status.textContent=ok?'Connexion Google réussie. Retourne dans Firebase > Authentication > Utilisateurs et actualise la liste.':'Prêt pour la connexion Google.';});login.onclick=async()=>{login.disabled=true;try{const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await auth.signInWithPopup(provider);}catch(e){status.textContent='Connexion non terminée : '+(e.code||e.message);}finally{login.disabled=false;}};logout.onclick=()=>auth.signOut();}catch(e){status.textContent='Initialisation impossible : '+(e.code||e.message);}})();
</script></body></html>
