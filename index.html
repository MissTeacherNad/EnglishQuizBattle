<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122743">
  <meta name="description" content="Quiz multijoueur pour la classe. Rejoindre une partie, répondre en direct et consulter le classement.">
  <title>English Quiz Battle · Quiz multijoueur</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">QB</span><span><strong>English Quiz Battle</strong><small>Live classroom games</small></span></div>
      <div class="top-right"><span id="netStatus" class="status">Connexion…</span><span class="top-label">Teacher & students</span></div>
    </header>
    <main id="app" class="app" aria-live="polite"><div class="loading"><div class="spinner"></div><p>Préparation du jeu…</p></div></main>
    <footer class="footer">Un quiz de classe sans compte élève · Les réponses sont synchronisées en direct</footer>
  </div>
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
